plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'fr.minenorth'
version = '1.23.0'
base { archivesName = 'minenorth-systeme' }


java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { minenorthdrill { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.7.1.3')
    implementation files('libs/minenorth_eurobank-1.0.0.jar')
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'MineNorth Systeme',
            'Specification-Vendor': 'MineNorth RP',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'MineNorth RP'
        ])
    }
}

jar.finalizedBy('reobfJar')
