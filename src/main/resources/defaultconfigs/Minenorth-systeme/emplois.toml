# MineNorth Systeme - Pôle Emploi
# Ajoutez/supprimez des blocs [[jobs]], puis utilisez /emploireload.

[general]
enabled = true
default_job = "civil"
# Commande console d'attribution optionnelle. Placeholders : {player}, {uuid}, {job}
assign_command = ""
premium_permission = "premium.job"

[salary]
# Désactivé par défaut.
enabled = false
interval_minutes = 40
# Exemple : "money give {player} {salary}"
command = ""

